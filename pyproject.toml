[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "warehouse-marl"
version = "0.1.0"
description = "Multi-agent warehouse pathfinding with fixed per-vehicle order sets, built on POGEMA"
requires-python = ">=3.9,<3.13"
dependencies = [
    "pogema==1.4.0",
    "gymnasium==0.28.1",
    "stable-baselines3==2.3.2",
    "torch>=2.0",
    "numpy>=1.24,<2",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "tensorboard>=2.14"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
