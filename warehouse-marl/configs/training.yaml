# Hyperparameters for scripts/train.py (Stable-Baselines3 PPO,
# one shared policy across all vehicles = parameter-shared IPPO).

total_timesteps: 400000
policy: MlpPolicy      # try CnnPolicy later: observations are (3, H, W) grids
n_steps: 256            # rollout length per vehicle before each update
batch_size: 256
n_epochs: 10
gamma: 0.99
gae_lambda: 0.95
clip_range: 0.2
learning_rate: 0.0003
ent_coef: 0.01
vf_coef: 0.5
max_grad_norm: 0.5

seed: 0
log_dir: runs
checkpoint_dir: checkpoints
checkpoint_every: 50000
eval_episodes: 20
