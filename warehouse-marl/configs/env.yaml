# Scenario definition for the v1 (fixed orders, episodic) environment.

map_path: maps/small_warehouse.txt

# Each vehicle's depot: where it starts, and where it must return to.
# Vehicles do NOT share a depot.
depots:
  agv_0: [0, 0]
  agv_1: [6, 10]
  agv_2: [3, 5]

# The fixed set of nodes each vehicle must visit this episode.
# Every vehicle needs at least one order. Nothing new arrives mid-episode.
orders:
  agv_0: [[6, 0], [3, 3]]
  agv_1: [[0, 10], [6, 6]]
  agv_2: [[0, 5], [6, 5]]

# How the *set* of orders becomes an ordered tour:
#   nearest  - greedy nearest-neighbour from the depot (Manhattan)
#   as_given - visit exactly in the order listed above
order_strategy: nearest

obs_radius: 5
collision_system: soft    # "soft" (POGEMA's own LMAPF setting) or "priority" (POGEMA default)
max_episode_steps: 256

# Reward shaping
goal_reward: 1.0          # per node reached
step_penalty: 0.01        # per step while unfinished -> favours shorter tours
completion_bonus: 5.0     # one-off, when a vehicle finishes its tour and is home

seed: 0
